<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>CyberPong 霓虹乒乓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#070b16;--panel:rgba(15,23,42,.8);--line:rgba(148,163,184,.2);
  --cyan:#22d3ee;--pink:#f472b6;--amber:#fbbf24;--text:#f1f5f9;--muted:#94a3b8;
  --num:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);overscroll-behavior:none}
body{
  font-family:"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  background:radial-gradient(600px 400px at 0 0,rgba(34,211,238,.10),transparent 70%),
             radial-gradient(600px 400px at 100% 100%,rgba(244,114,182,.10),transparent 70%),var(--bg);
}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.icon-btn svg[hidden]{display:none}
.pscore,.rally b,.stat b,.pause-score{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{
  position:fixed;inset:0;display:flex;flex-direction:column;gap:8px;
  padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
}

/* HUD */
.hud{
  width:100%;max-width:1100px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.player{display:flex;align-items:center;gap:8px;min-width:0}
.player.p2{justify-content:flex-end;text-align:right}
.bar{width:5px;height:34px;border-radius:5px;flex:none}
.p1 .bar{background:var(--cyan);box-shadow:0 0 10px var(--cyan)}
.p2 .bar{background:var(--pink);box-shadow:0 0 10px var(--pink)}
.pname{display:block;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p1 .pname{color:var(--cyan)} .p2 .pname{color:var(--pink)}
.pscore{display:block;font-family:var(--num);font-weight:900;font-size:clamp(22px,4.5vw,34px);line-height:1.05}
.center{display:flex;align-items:center;gap:6px}
.rally{display:flex;flex-direction:column;align-items:center;min-width:64px;line-height:1.2}
.rally small{font-size:11px;color:var(--muted);white-space:nowrap}
.rally span{font-size:12px;color:var(--muted)}
.rally b{font-family:var(--num);font-size:18px;color:var(--amber)}
.icon-btn{
  width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none;
  background:rgba(30,41,59,.85);border:1px solid var(--line);color:#cbd5e1;
}
.icon-btn:active{transform:scale(.94)}
.icon-btn svg{width:22px;height:22px}

/* Stage */
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
#game{
  display:block;border-radius:16px;touch-action:none;cursor:none;
  border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.5),0 0 0 1px rgba(34,211,238,.06);
}
.combo{
  position:absolute;top:14px;left:50%;transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;
  font-weight:900;font-size:clamp(14px,3.6vw,20px);color:#fde68a;letter-spacing:.06em;white-space:nowrap;
  background:rgba(245,158,11,.18);border:1px solid rgba(251,191,36,.45);padding:6px 16px;border-radius:999px;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.combo.show{opacity:1;transform:translateX(-50%) scale(1)}

/* Overlays */
.overlay{
  position:fixed;inset:0;z-index:30;display:flex;overflow-y:auto;-webkit-overflow-scrolling:touch;
  background:rgba(4,7,16,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
}
.overlay[hidden]{display:none}
.sheet{
  margin:auto;width:min(480px,100%);background:rgba(15,23,42,.92);border:1px solid var(--line);
  border-radius:20px;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.55);
}
.title{
  margin:0;font-family:'Orbitron',var(--num);font-weight:900;font-size:clamp(30px,8vw,46px);letter-spacing:.02em;line-height:1.1;
  background:linear-gradient(90deg,var(--cyan),#e0f2fe 50%,var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;
}
.subtitle{margin:4px 0 0;color:var(--muted);font-size:14px}
.menu{display:grid;gap:16px;grid-template-areas:"intro" "settings" "start" "help"}
.menu-intro{grid-area:intro;text-align:center}
.menu-settings{grid-area:settings;display:grid;gap:14px}
.menu-start{grid-area:start}
.menu-help{grid-area:help}
.label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;background:rgba(2,6,23,.6);padding:4px;border-radius:14px;border:1px solid var(--line)}
.seg button{
  min-height:44px;border-radius:10px;border:1px solid transparent;background:transparent;color:#cbd5e1;font-weight:700;font-size:15px;padding:6px 4px;line-height:1.2;
}
.seg button small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:rgba(34,211,238,.16);border-color:rgba(34,211,238,.6);color:#a5f3fc}
.seg button[aria-pressed="true"] small{color:#67e8f9}
.btn{
  width:100%;min-height:50px;border-radius:14px;border:1px solid var(--line);background:rgba(30,41,59,.9);
  font-weight:800;font-size:16px;letter-spacing:.04em;
}
.btn:active{transform:translateY(1px)}
.btn.primary{border:0;color:#04121a;background:linear-gradient(90deg,var(--cyan),var(--pink));box-shadow:0 10px 30px rgba(34,211,238,.25);font-size:18px;min-height:56px}
.btn.ghost{background:transparent;color:var(--muted)}
.stack{display:grid;gap:10px}
.help{
  margin:0;padding:12px 14px;border-radius:14px;background:rgba(2,6,23,.5);border:1px solid var(--line);
  color:#cbd5e1;font-size:14px;line-height:1.6;
}
.help p{margin:0}
.note{margin:8px 2px 0;font-size:13px;line-height:1.5;color:var(--amber)}
.help p+p{margin-top:4px}
.help .best{color:var(--amber)}
.badge{display:inline-block;padding:4px 12px;border-radius:999px;font-size:13px;font-weight:800;letter-spacing:.08em}
.center-text{text-align:center}
h2.big{margin:10px 0 16px;font-size:clamp(26px,7vw,36px);font-weight:900}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;text-align:left}
.stat{background:rgba(2,6,23,.6);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat b{font-family:var(--num);font-size:18px}
.row{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.pause-score{font-family:var(--num);font-size:28px;margin:-6px 0 16px;color:#e2e8f0}
.pause-score .c{color:var(--cyan)} .pause-score .p{color:var(--pink)}

/* Short landscape phones */
@media (orientation:landscape) and (max-height:520px){
  .hud{padding:4px 10px;border-radius:12px}
  .bar{height:28px}
  .pscore{font-size:24px}
  .icon-btn{width:40px;height:40px}
  .app{gap:6px}
  .sheet{width:min(860px,100%);padding:16px}
  .menu{grid-template-columns:1fr 1.15fr;grid-template-areas:"intro settings" "start settings" "help settings";gap:12px 20px;align-items:start}
  .menu-intro{text-align:left}
  .title{font-size:34px}
  .menu-settings{gap:10px}
  .seg button{min-height:42px}
  h2.big{margin:6px 0 10px}
  .stats{grid-template-columns:repeat(4,1fr);margin-bottom:12px}
  .gameover .sheet,.pause .sheet{width:min(620px,100%)}
}
@media (prefers-reduced-motion:reduce){.combo{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header class="hud" aria-label="計分板">
    <div class="player p1">
      <div class="bar"></div>
      <div><span class="pname" id="nameP1">你</span><span class="pscore" id="scoreP1">0</span></div>
    </div>
    <div class="center">
      <div class="rally"><small id="hudTarget">先得 11 分</small><span>連擊 <b id="hudRally">0</b></span></div>
      <button class="icon-btn" id="btnSound" aria-label="關閉音效" title="音效">
        <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
        <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m17 9 4 6m0-6-4 6"/></svg>
      </button>
      <button class="icon-btn" id="btnPause" aria-label="暫停" title="暫停（P）">
        <svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg>
      </button>
    </div>
    <div class="player p2">
      <div><span class="pname" id="nameP2">電腦（標準）</span><span class="pscore" id="scoreP2">0</span></div>
      <div class="bar"></div>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="game" aria-label="乒乓球桌"></canvas>
    <div class="combo" id="combo" aria-hidden="true"></div>
  </main>
  <div class="sr" aria-live="polite" id="live"></div>
</div>

<!-- 主選單 -->
<section class="overlay" id="menuOverlay" aria-labelledby="menuTitle">
  <div class="sheet">
    <div class="menu">
      <div class="menu-intro">
        <h1 class="title" id="menuTitle">CYBER PONG</h1>
        <p class="subtitle">霓虹乒乓 · 單人挑戰或兩人同機對打</p>
      </div>
      <div class="menu-settings">
        <div>
          <span class="label" id="lblMode">對戰模式</span>
          <div class="seg" role="group" aria-labelledby="lblMode" data-key="mode">
            <button data-value="1P">單人<small>對電腦</small></button>
            <button data-value="2P">雙人<small>同一部機</small></button>
          </div>
        </div>
        <div id="diffGroup">
          <span class="label" id="lblDiff">電腦難度</span>
          <div class="seg" role="group" aria-labelledby="lblDiff" data-key="difficulty">
            <button data-value="easy">新手</button>
            <button data-value="medium">標準</button>
            <button data-value="hard">高手</button>
          </div>
        </div>
        <div id="ctrlGroup" hidden>
          <span class="label" id="lblCtrl">操控方式</span>
          <div class="seg" role="group" aria-labelledby="lblCtrl" data-key="control">
            <button data-value="touch">手指滑動</button>
            <button data-value="tilt">傾側手機<small>陀螺儀</small></button>
          </div>
          <div id="sensGroup" hidden style="margin-top:8px">
            <span class="label" id="lblSens">傾側靈敏度</span>
            <div class="seg" role="group" aria-labelledby="lblSens" data-key="sens">
              <button data-value="low">低<small>大幅傾側</small></button>
              <button data-value="mid">中</button>
              <button data-value="high">高<small>輕微傾側</small></button>
            </div>
          </div>
          <p class="note" id="tiltNote" hidden></p>
        </div>
        <div>
          <span class="label" id="lblTarget">勝出分數</span>
          <div class="seg" role="group" aria-labelledby="lblTarget" data-key="target">
            <button data-value="5">5 分<small>快速</small></button>
            <button data-value="11">11 分<small>標準</small></button>
            <button data-value="21">21 分<small>長賽</small></button>
          </div>
        </div>
      </div>
      <div class="menu-start stack">
        <button class="btn primary" id="btnStart">開始比賽</button>
        <button class="btn ghost" id="btnFull" hidden>全螢幕遊玩</button>
      </div>
      <div class="menu-help help" id="helpBox"></div>
    </div>
  </div>
</section>

<!-- 暫停 -->
<section class="overlay pause" id="pauseOverlay" aria-labelledby="pauseTitle" hidden>
  <div class="sheet center-text">
    <h2 class="big" id="pauseTitle">已暫停</h2>
    <div class="pause-score" id="pauseScore"></div>
    <div class="stack">
      <button class="btn primary" id="btnResume">繼續比賽</button>
      <button class="btn" id="btnRestart">重新開始</button>
      <button class="btn ghost" id="btnMenu1">返回主選單</button>
    </div>
  </div>
</section>

<!-- 完場 -->
<section class="overlay gameover" id="overOverlay" aria-labelledby="winTitle" hidden>
  <div class="sheet center-text">
    <span class="badge" id="winBadge">勝利</span>
    <h2 class="big" id="winTitle">你贏了！</h2>
    <div class="stats">
      <div class="stat"><small>比分</small><b id="stScore">11 - 8</b></div>
      <div class="stat"><small>最長連擊</small><b id="stRally" style="color:var(--amber)">0</b></div>
      <div class="stat"><small>比賽時間</small><b id="stTime">00:00</b></div>
      <div class="stat"><small>最高球速</small><b id="stSpeed" style="color:var(--cyan)">0</b></div>
    </div>
    <div class="row">
      <button class="btn primary" id="btnAgain">再玩一局</button>
      <button class="btn" id="btnMenu2">主選單</button>
    </div>
  </div>
</section>

<script>
(() => {
'use strict';

// ---------- 音效 ----------
class Sound {
  constructor(){ this.ctx = null; this.muted = false; }
  init(){
    if (!this.ctx){ const A = window.AudioContext || window.webkitAudioContext; if (A) this.ctx = new A(); }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  tone(type, f1, f2, vol, dur, at = 0){
    if (this.muted || !this.ctx) return;
    try {
      const t = this.ctx.currentTime + at, o = this.ctx.createOscillator(), g = this.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f1, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) {}
  }
  hit(p1){ this.tone(p1 ? 'sine' : 'triangle', p1 ? 440 : 360, 140, 0.3, 0.08); }
  wall(){ this.tone('sine', 220, 120, 0.15, 0.05); }
  score(){ [523.25, 659.25, 783.99].forEach((f, i) => this.tone('sine', f, 0, 0.2, 0.15, i * 0.06)); }
  tick(){ this.tone('square', 660, 0, 0.06, 0.06); }
  win(){ [440, 554.37, 659.25, 880].forEach((f, i) => this.tone('triangle', f, 0, 0.25, 0.3, i * 0.09)); }
}
const sound = new Sound();

// ---------- 常數及狀態 ----------
const W = 1000, H = 600, WALL = 10, STEP = 1000 / 60;
const PW = 16, PH = 110, PM = 35, R = 10, V0 = 8.5, VMAX = 22;
const AI = {
  easy:   { speed: 4.5,  lerp: 0.05, err: 45, reach: 500 },
  medium: { speed: 7.0,  lerp: 0.10, err: 20, reach: 700 },
  hard:   { speed: 10.5, lerp: 0.18, err: 5,  reach: 950 }
};
const DIFF_NAME = { easy: '新手', medium: '標準', hard: '高手' };
const isTouch = matchMedia('(pointer: coarse)').matches;

const store = {
  get(k, d){ try { const v = localStorage.getItem('cyberpong.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v){ try { localStorage.setItem('cyberpong.' + k, JSON.stringify(v)); } catch (e) {} }
};
const settings = Object.assign({ mode: '1P', difficulty: 'medium', target: '11', control: 'touch', sens: 'mid' }, store.get('settings', {}));
sound.muted = store.get('muted', false);
let bestRally = store.get('bestRally', 0);

let state = 'MENU';          // MENU, COUNTDOWN, PLAYING, POINT, PAUSED, GAMEOVER
let timer = 0, firstServe = true, pointMsg = null;
let s1 = 0, s2 = 0, rally = 0, maxRally = 0, playMs = 0, topSpeed = 0;
let aiErr = 0, aiErrSet = false;
const keys = {};
const p1 = { x: PM, y: H / 2 - PH / 2, ty: H / 2 - PH / 2, color: '#22d3ee', human: true };
const p2 = { x: W - PM - PW, y: H / 2 - PH / 2, ty: H / 2 - PH / 2, color: '#f472b6', human: false };
const ball = { x: W / 2, y: H / 2, vx: V0, vy: 0, speed: V0, trail: [] };
let particles = [], confetti = [];

// ---------- DOM ----------
const $ = id => document.getElementById(id);
const canvas = $('game'), ctx = canvas.getContext('2d'), stage = $('stage');
const menuOv = $('menuOverlay'), pauseOv = $('pauseOverlay'), overOv = $('overOverlay');

// ---------- 版面：橫向球桌 / 直向球桌 ----------
const view = { portrait: false, s: 1, dpr: 1, cw: 0, ch: 0 };
function fit(){
  const r = stage.getBoundingClientRect();
  if (r.width < 10 || r.height < 10) return;
  const portrait = r.height > r.width * 1.05;
  const aspect = portrait ? H / W : W / H;
  let cw = r.width, ch = cw / aspect;
  if (ch > r.height){ ch = r.height; cw = ch * aspect; }
  cw = Math.floor(cw); ch = Math.floor(ch);
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const flipped = view.cw && portrait !== view.portrait;
  Object.assign(view, { portrait, cw, ch, dpr, s: portrait ? cw / H : cw / W });
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.width = Math.round(cw * dpr); canvas.height = Math.round(ch * dpr);
  updateHelp();
  if (flipped && (state === 'PLAYING' || state === 'COUNTDOWN' || state === 'POINT')) pause('畫面已轉向');
  render();
}
function worldTransform(){
  const k = view.s * view.dpr;
  if (view.portrait) ctx.setTransform(0, -k, k, 0, 0, W * k);   // 玩家一在下方
  else ctx.setTransform(k, 0, 0, k, 0, 0);
}
function screenTransform(){ ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0); }
function toWorld(cx, cy){
  const r = canvas.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
  return view.portrait ? { x: W - py / view.s, y: px / view.s } : { x: px / view.s, y: py / view.s };
}
new ResizeObserver(fit).observe(stage);
window.addEventListener('orientationchange', () => setTimeout(fit, 150));

// ---------- 介面 ----------
function syncSettingsUI(){
  document.querySelectorAll('.seg').forEach(seg => {
    seg.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.value === settings[seg.dataset.key])));
  });
  $('diffGroup').hidden = settings.mode !== '1P';
  $('ctrlGroup').hidden = !tilt.supported || settings.mode !== '1P';
  $('sensGroup').hidden = settings.control !== 'tilt';
  $('hudTarget').textContent = `先得 ${settings.target} 分`;
  p2.human = settings.mode === '2P';
  $('nameP1').textContent = p2.human ? '玩家一' : '你';
  $('nameP2').textContent = p2.human ? '玩家二' : `電腦（${DIFF_NAME[settings.difficulty]}）`;
  updateHelp();
}
function updateHelp(){
  const box = $('helpBox'); if (!box) return;
  const two = settings.mode === '2P';
  const near = view.portrait ? '下方' : '左方', far = view.portrait ? '上方' : '右方';
  const slide = view.portrait ? '左右' : '上下';
  let lines;
  if (isTouch){
    lines = two
      ? [`兩人各按住自己半邊球桌${slide}滑動：藍色球拍在${near}，粉紅球拍在${far}。`]
      : tiltOn()
        ? [`把手機向${slide}傾側，${near}藍色球拍會向較低的一邊移動；每次倒數時會以當刻手機角度作為中間位置。`, '傾側時建議先開啟手機的「螢幕方向鎖定」，避免畫面轉向。']
        : [`手指在球桌上${slide}滑動，${near}藍色球拍會跟住手指。`];

const pointers = new Map();
function sideAt(pt){ return settings.mode === '2P' && pt.x >= W / 2 ? p2 : p1; }
function aim(p, y){ p.ty = Math.max(WALL, Math.min(H - PH - WALL, y - PH / 2)); }
canvas.addEventListener('pointerdown', e => {

// ---------- 陀螺儀（傾側手機控制球拍） ----------
function tiltNote(msg){ const n = $('tiltNote'); n.textContent = msg; n.hidden = !msg; }
function tiltOn(){ return tilt.supported && settings.control === 'tilt' && settings.mode === '1P'; }
function screenAngle(){
  const a = screen.orientation && typeof screen.orientation.angle === 'number' ? screen.orientation.angle : (window.orientation || 0);
  return ((a % 360) + 360) % 360 * Math.PI / 180;
}
function fallbackToTouch(msg){
  settings.control = 'touch'; store.set('settings', settings); syncSettingsUI();
  tiltNote(msg); if (state !== 'MENU') combo(msg);
}
const tilt = {
  supported: isTouch && 'DeviceOrientationEvent' in window,
  granted: false, listening: false, gotData: false,
  value: 0, neutral: 0, calibrate: true,
  enable(){
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function'){
      D.requestPermission().then(r => {
        if (r === 'granted') this.listen();
        else fallbackToTouch('未獲准使用動作感應，已改回手指操控。可在 Safari 網站設定中允許「動作與方向」。');
      }).catch(() => fallbackToTouch('未能開啟動作感應，已改回手指操控。'));
    } else this.listen();
  },
  listen(){
    this.granted = true; tiltNote('');
    if (this.listening) return;
    this.listening = true;
    window.addEventListener('deviceorientation', e => {
      if (e.beta == null || e.gamma == null) return;
      const b = e.beta * Math.PI / 180, g = e.gamma * Math.PI / 180;
      const gx = Math.sin(g) * Math.cos(b), gy = -Math.sin(b);          // 重力在機身平面（x 向右、y 向上）
      const a = screenAngle();
      const sx = gx * Math.cos(a) - gy * Math.sin(a);                    // 轉成螢幕方向
      const sDown = -(gx * Math.sin(a) + gy * Math.cos(a));
      const v = view.portrait ? sx : sDown;                              // 球拍移動方向
      this.value = this.gotData ? this.value + (v - this.value) * 0.5 : v;
      this.gotData = true;
    });
    setTimeout(() => { if (!this.gotData && tiltOn()) fallbackToTouch('這部裝置沒有回傳陀螺儀數據，已改回手指操控。'); }, 2000);
  }
};
function applyTilt(){
  if (!tilt.gotData) return;
  for (const p of pointers.values()) if (p === p1) return;             // 手指觸碰時優先
  if (tilt.calibrate){ tilt.neutral = tilt.value; tilt.calibrate = false; }
  const range = { low: 0.5, mid: 0.34, high: 0.22 }[settings.sens] || 0.34;   // 約 30°／20°／13°
  const t = Math.max(-1, Math.min(1, (tilt.value - tilt.neutral) / range));
  const lo = WALL, hi = H - PH - WALL;
  p1.ty = lo + (t + 1) / 2 * (hi - lo);
}
if (tiltOn() && typeof (window.DeviceOrientationEvent || {}).requestPermission !== 'function') tilt.listen();   // iOS 要等按「開始比賽」才可請求權限
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

// ---------- 遊戲邏輯 ----------
function resetBall(dir){
  const a = Math.random() * 0.8 - 0.4;
  Object.assign(ball, { x: W / 2, y: H / 2, speed: V0, vx: dir * V0 * Math.cos(a), vy: V0 * Math.sin(a), trail: [] });
  rally = 0; aiErrSet = false;
}
function updateHUD(){
  $('scoreP1').textContent = s1; $('scoreP2').textContent = s2; $('hudRally').textContent = rally;
}
function burst(x, y, color, n){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = Math.random() * 5 + 2;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: Math.random() * 3 + 2, color, a: 1, d: Math.random() * 0.03 + 0.02 });
  }
}
let comboTimer = 0;
function combo(text){
  const el = $('combo'); el.textContent = text; el.classList.add('show');
  clearTimeout(comboTimer); comboTimer = setTimeout(() => el.classList.remove('show'), 1200);
}
function vibrate(ms){ if (!sound.muted && navigator.vibrate) try { navigator.vibrate(ms); } catch (e) {} }

function movePaddle(p, up, down){
  const sp = 10;
  if (up){ p.y -= sp; p.ty = p.y; }
  else if (down){ p.y += sp; p.ty = p.y; }
  else p.y += (p.ty - p.y) * 0.35;
  p.y = Math.max(WALL, Math.min(H - PH - WALL, p.y));
}
function updateAI(){
  const c = AI[settings.difficulty];
  let target = H / 2;
  const live = state === 'PLAYING';
  if (live && ball.vx > 0){
    if (!aiErrSet){ aiErr = (Math.random() * 2 - 1) * c.err; aiErrSet = true; }
    if (ball.x > W - c.reach){
      let y = ball.y + ball.vy * ((p2.x - ball.x) / ball.vx);
      for (let i = 0; i < 8 && (y < 0 || y > H); i++) y = y < 0 ? -y : 2 * H - y;
      target = y + aiErr;
    }
  } else aiErrSet = false;
  const vy = ((target - PH / 2) - p2.y) * c.lerp;
  p2.y += Math.max(-c.speed, Math.min(c.speed, vy));
  p2.y = Math.max(WALL, Math.min(H - PH - WALL, p2.y));
}
function updatePaddles(){
  const two = settings.mode === '2P';
  if (tiltOn() && !two) applyTilt();
  movePaddle(p1, keys.w || keys.a || (!two && (keys.ArrowUp || keys.ArrowLeft)), keys.s || keys.d || (!two && (keys.ArrowDown || keys.ArrowRight)));
  if (two) movePaddle(p2, keys.ArrowUp || keys.ArrowLeft, keys.ArrowDown || keys.ArrowRight);
  else updateAI();
}
function paddleHit(p, isLeft){
  const off = (ball.y - (p.y + PH / 2)) / (PH / 2);
  const ang = Math.max(-1, Math.min(1, off)) * Math.PI * 0.35;
  ball.speed = Math.min(VMAX, ball.speed * 1.05);
  ball.vx = (isLeft ? 1 : -1) * ball.speed * Math.cos(ang);
  ball.vy = ball.speed * Math.sin(ang);
  ball.x = isLeft ? p.x + PW + R : p.x - R;
  rally++; if (rally > maxRally) maxRally = rally;
  updateHUD();
  if (rally >= 5 && rally % 5 === 0) combo(rally === 5 ? '5 連擊！' : rally === 10 ? '10 連擊！好犀利' : rally === 15 ? '15 連擊！神級反應' : `${rally} 連擊！`);
  sound.hit(isLeft);
  if (p.human) vibrate(12);
  burst(ball.x, ball.y, p.color, 16);
}
function crosses(px, py, plane, p){
  if (!((px - plane) * (ball.x - plane) <= 0)) return false;
  const t = px === ball.x ? 0 : (px - plane) / (px - ball.x);
  const y = py + (ball.y - py) * t;
  return y + R >= p.y && y - R <= p.y + PH;
}
function overlaps(p){
  return ball.x + R >= p.x && ball.x - R <= p.x + PW && ball.y + R >= p.y && ball.y - R <= p.y + PH;
}
function updateBall(){
  const px = ball.x, py = ball.y;
  ball.x += ball.vx; ball.y += ball.vy;
  ball.trail.push({ x: ball.x, y: ball.y }); if (ball.trail.length > 10) ball.trail.shift();
  topSpeed = Math.max(topSpeed, Math.hypot(ball.vx, ball.vy));

  if (ball.y - R <= WALL){ ball.y = WALL + R; ball.vy = Math.abs(ball.vy); sound.wall(); burst(ball.x, ball.y, '#fff', 6); }
  else if (ball.y + R >= H - WALL){ ball.y = H - WALL - R; ball.vy = -Math.abs(ball.vy); sound.wall(); burst(ball.x, ball.y, '#fff', 6); }

  if (ball.vx < 0 && px - R >= p1.x && (crosses(px, py, p1.x + PW + R, p1) || overlaps(p1))) paddleHit(p1, true);
  else if (ball.vx > 0 && px + R <= p2.x + PW && (crosses(px, py, p2.x - R, p2) || overlaps(p2))) paddleHit(p2, false);

  if (ball.x + R < 0) scored(2);
  else if (ball.x - R > W) scored(1);
}
function scored(who){
  if (who === 1) s1++; else s2++;
  sound.score();
  burst(Math.max(0, Math.min(W, ball.x)), ball.y, who === 1 ? p1.color : p2.color, 25);
  updateHUD();
  const name = who === 1 ? $('nameP1').textContent : $('nameP2').textContent;
  $('live').textContent = `${name}得分，${s1} 比 ${s2}`;
  if (s1 >= +settings.target || s2 >= +settings.target) return gameOver();
  pointMsg = { text: who === 1 ? (p2.human ? '玩家一得分' : '你得分！') : (p2.human ? '玩家二得分' : '電腦得分'), color: who === 1 ? p1.color : p2.color };
  resetBall(who === 1 ? -1 : 1);
  state = 'POINT'; timer = 1000;
}
function gameOver(){
  state = 'GAMEOVER';
  sound.win(); vibrate([30, 60, 30]);
  for (let i = 0; i < 80; i++) confetti.push({ x: Math.random() * W, y: -20 - Math.random() * 100, vx: (Math.random() - 0.5) * 4, vy: Math.random() * 4 + 2, s: Math.random() * 8 + 4, c: ['#22d3ee', '#f472b6', '#fbbf24', '#34d399', '#818cf8'][i % 5], r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.2 });
  const p1Won = s1 > s2, two = p2.human;
  const badge = $('winBadge'), title = $('winTitle');
  if (two){ badge.textContent = '比賽結束'; title.textContent = p1Won ? '玩家一勝出！' : '玩家二勝出！'; }
  else { badge.textContent = p1Won ? '勝利' : '再接再厲'; title.textContent = p1Won ? '你贏了！' : '電腦勝出'; }
  const col = p1Won ? 'var(--cyan)' : 'var(--pink)';
  title.style.color = col; badge.style.color = col;
  badge.style.background = p1Won ? 'rgba(34,211,238,.15)' : 'rgba(244,114,182,.15)';
  $('stScore').textContent = `${s1} - ${s2}`;
  let rallyTxt = `${maxRally} 下`;
  if (maxRally > bestRally){ if (bestRally > 0) rallyTxt += ' 新紀錄'; bestRally = maxRally; store.set('bestRally', bestRally); }
  $('stRally').textContent = rallyTxt;
  const sec = Math.floor(playMs / 1000);
  $('stTime').textContent = `${String(Math.floor(sec / 60)).padStart(2, '0')}:${String(sec % 60).padStart(2, '0')}`;
  $('stSpeed').textContent = `${Math.round(topSpeed * 3.5)} km/h`;
  setTimeout(() => { if (state === 'GAMEOVER') show(overOv); }, 900);
}

let lastTick = 4;
function step(){
  for (let i = particles.length - 1; i >= 0; i--){ const p = particles[i]; p.x += p.vx; p.y += p.vy; p.a -= p.d; if (p.a <= 0) particles.splice(i, 1); }
  for (let i = confetti.length - 1; i >= 0; i--){ const c = confetti[i]; c.x += c.vx; c.y += c.vy; c.r += c.vr; if (c.y > H + 20) confetti.splice(i, 1); }
  if (state === 'COUNTDOWN'){
    timer -= STEP; updatePaddles();
    const n = Math.ceil(timer / 600);
    if (n !== lastTick && n > 0){ lastTick = n; sound.tick(); }
    if (timer <= 0){ state = 'PLAYING'; firstServe = false; }
  } else if (state === 'POINT'){
    timer -= STEP; updatePaddles();
    if (timer <= 0){ state = 'PLAYING'; pointMsg = null; }
  } else if (state === 'PLAYING'){
    playMs += STEP; updatePaddles(); updateBall();
  }
}

// ---------- 繪圖 ----------
function rr(x, y, w, h, r){
  ctx.beginPath();
  if (ctx.roundRect){ ctx.roundRect(x, y, w, h, r); return; }
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawTable(){
  const g = ctx.createLinearGradient(0, 0, W, 0);
  g.addColorStop(0, '#0b1324'); g.addColorStop(0.5, '#080e1c'); g.addColorStop(1, '#0b1324');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.12)'; ctx.lineWidth = 10; ctx.strokeRect(5, 5, W - 10, H - 10);
  ctx.strokeStyle = 'rgba(255,255,255,.4)'; ctx.lineWidth = 3; ctx.strokeRect(15, 15, W - 30, H - 30);
  ctx.save(); ctx.setLineDash([12, 10]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(W / 2, 15); ctx.lineTo(W / 2, H - 15); ctx.stroke(); ctx.restore();
  ctx.fillStyle = '#38bdf8'; ctx.fillRect(W / 2 - 3, 10, 6, 12); ctx.fillRect(W / 2 - 3, H - 22, 6, 12);
  if (settings.mode === '2P' && (state === 'COUNTDOWN' || state === 'MENU')){
    ctx.fillStyle = 'rgba(34,211,238,.05)'; ctx.fillRect(15, 15, W / 2 - 15, H - 30);
    ctx.fillStyle = 'rgba(244,114,182,.05)'; ctx.fillRect(W / 2, 15, W / 2 - 15, H - 30);
  }
}
function drawBigScores(){
  screenTransform();
  const { cw, ch, portrait } = view;
  ctx.font = `900 ${Math.round(Math.min(cw, ch) * 0.3)}px system-ui, -apple-system, sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const a = portrait ? [cw / 2, ch * 0.75] : [cw * 0.25, ch / 2];
  const b = portrait ? [cw / 2, ch * 0.25] : [cw * 0.75, ch / 2];
  ctx.fillStyle = 'rgba(34,211,238,.07)'; ctx.fillText(s1, a[0], a[1]);
  ctx.fillStyle = 'rgba(244,114,182,.07)'; ctx.fillText(s2, b[0], b[1]);
  worldTransform();
}
function drawPaddle(p){
  ctx.save(); ctx.shadowColor = p.color; ctx.shadowBlur = 18; ctx.fillStyle = p.color;
  rr(p.x, p.y, PW, PH, 8); ctx.fill();
  ctx.shadowBlur = 0; ctx.fillStyle = '#fff'; rr(p.x + 3, p.y + 6, PW - 6, PH - 12, 4); ctx.fill(); ctx.restore();
}
function drawBall(){
  ball.trail.forEach((pt, i) => {
    const k = (i + 1) / ball.trail.length;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, R * k, 0, Math.PI * 2); ctx.fillStyle = `rgba(56,189,248,${k * 0.45})`; ctx.fill();
  });
  const waiting = state === 'COUNTDOWN' || state === 'POINT';
  const pulse = waiting ? 1 + Math.sin(performance.now() / 120) * 0.15 : 1;
  ctx.save(); ctx.shadowColor = '#38bdf8'; ctx.shadowBlur = 22;
  const g = ctx.createRadialGradient(ball.x - 3, ball.y - 3, 1, ball.x, ball.y, R * pulse);
  g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#e0f2fe'); g.addColorStop(1, '#0284c7');
  ctx.beginPath(); ctx.arc(ball.x, ball.y, R * pulse, 0, Math.PI * 2); ctx.fillStyle = g; ctx.fill(); ctx.restore();
}
function drawFx(){
  ctx.save();
  particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.a); ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); });
  ctx.globalAlpha = 1;
  confetti.forEach(c => { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-c.s / 2, -c.s / 2, c.s, c.s); ctx.restore(); });
  ctx.restore();
}
function label(text, y, size, color, weight = 800){
  ctx.font = `${weight} ${size}px "PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(2,6,23,.85)'; ctx.strokeText(text, view.cw / 2, y);
  ctx.fillStyle = color; ctx.fillText(text, view.cw / 2, y);
}
function drawMessages(){
  if (state !== 'COUNTDOWN' && state !== 'POINT') return;
  screenTransform();
  const { cw, ch, portrait } = view, base = Math.min(cw, ch);
  if (state === 'COUNTDOWN'){
    const n = Math.max(1, Math.ceil(timer / 600));
    ctx.font = `900 ${Math.round(base * 0.24)}px system-ui, -apple-system, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fbbf24'; ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 20;
    ctx.fillText(n, cw / 2, ch / 2 - (portrait ? 0 : base * 0.06)); ctx.shadowBlur = 0;
    if (firstServe){
      const sz = Math.max(13, Math.min(18, cw / 26));
      const two = settings.mode === '2P', slide = portrait ? '左右' : '上下';
      const msg = isTouch
        ? (two ? `各自在自己半邊${slide}滑動手指` : tiltOn() ? `拿穩手機，${slide}傾側控制藍色球拍` : `手指${slide}滑動控制藍色球拍`)
        : (two ? '玩家一 W／S　玩家二 ↑／↓' : '移動滑鼠或按 W／S 控制');
      label(msg, ch / 2 + base * (portrait ? 0.2 : 0.16), sz, '#e2e8f0', 700);
    }
  } else if (pointMsg){
    label(pointMsg.text, ch / 2 - base * 0.1, Math.max(18, Math.min(32, cw / 16)), pointMsg.color, 900);
  }
  worldTransform();
}
function render(){
  if (!view.cw) return;
  worldTransform();
  drawTable(); drawBigScores(); drawPaddle(p1); drawPaddle(p2); drawBall(); drawFx(); drawMessages();
}

// ---------- 主迴圈（固定 60Hz 物理，120Hz 手機速度一致） ----------
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP){ step(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}

syncSettingsUI(); syncSoundUI(); fit(); show(menuOv);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
